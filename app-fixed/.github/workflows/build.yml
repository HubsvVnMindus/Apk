
name: TST-TOOLV11

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # 1. Download source code
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Java
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install Ubuntu dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev build-essential ccache

      # 5. Install Buildozer
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36

      # 6. Check project configuration
      - name: Check project files
        run: |
          test -f buildozer.spec
          test -f main.py
          echo "Project files found."

      # 7. Build APK
      - name: Build debug APK
        run: |
          yes | buildozer -v android debug

      # 8. Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TST-TOOL-NOVA-ANDROID-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      # 9. Publish GitHub Release when pushing a v* tag
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/*.apk
          generate_release_notes: true
